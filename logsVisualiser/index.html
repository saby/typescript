<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TypeScript Errors</title>
    <style>
        .root {
            display: flex;
        }

        .tsLogs-modulesList {
            display: grid;
            grid-template-columns: 4fr 1fr;
            height: fit-content;
            flex-shrink: 1;
            overflow: hidden;
            overflow-y: auto;
            height: 100%;
            min-width: 400px;
        }

        .tsLogs-modulesList__module, .tsLogs-modulesList__library {
            display: contents;
            cursor: pointer;
        }

        .tsLogs-modulesList__library {
            font-size: 0.8rem;
        }

        .tsLogs-modulesList__libName {
            padding-left: 10px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }

        .tsLogs-modulesList__number {
            color: red;
        }

        .tsLogs-modulesList__module_selected {
            font-weight: bold;
        }

        .tsLogs-errorsList {
            display: grid;
            grid-template-columns: 4fr 1fr;
            border-top: 1px solid black;
            border-left: 1px solid black;
            margin-right: 10px;
            height: fit-content;
            overflow-y: auto;
            height: 100%;
        }

        .tsLogs-errorsList__cell {
            border-right: 1px solid black;
            border-bottom: 1px solid black;
            padding: 10px;
        }
    </style>
    <script>
        function loadMeta() {
            return fetch('./meta.json').then((meta) => {
               return meta.json();
            }).catch((err) => {
               console.error(`Возникла ошибка при вычитывании метаданных: ${err}`);
            });
        }
        function loadData(meta) {
           const promises = meta.files.map((fileName) => {
              return fetch(`./${fileName}`).then((file) => {
                 return file.json();
              });
           });
           return Promise.all(promises).then((...files) => {
                return files.flat(2);
           }).catch((err) => {
              console.error(`Возникла ошибка при вычитывании данных с ошибками: ${err}`);
           });
        }
        function ModulesList(numberOfErrorsByModule, selectedModule, onSelectedChange) {
           const container = document.createElement('div');
           container.classList.add('tsLogs-modulesList');
           const selectedClass = 'tsLogs-modulesList__module_selected';
           let selectedElement;
           Object.entries(numberOfErrorsByModule).forEach(([moduleName, libraries]) => {
              const elem = document.createElement('div');
              elem.setAttribute('data-moduleName', moduleName);
              elem.classList.add('tsLogs-modulesList__module');
              if (moduleName === selectedModule) {
                 elem.classList.add(selectedClass);
                 selectedElement = elem;
              }
              const num = document.createElement('span');
              num.classList.add('tsLogs-modulesList__number');
              num.textContent = libraries.total;
              elem.append(`${moduleName} `, num);
              container.appendChild(elem);
              Object.entries(libraries).forEach(([libName, numberOfErrors]) => {
                 if (libName === 'total') {
                    return;
                 }
                 const libElem = document.createElement('div');
                 libElem.setAttribute('data-libraryName', libName);
                 libElem.setAttribute('data-moduleName', moduleName);
                 libElem.setAttribute('title', libName);
                 libElem.classList.add('tsLogs-modulesList__library');
                 if (libName === selectedModule) {
                    libElem.classList.add(selectedClass);
                    selectedElement = libElem;
                 }
                 const text = document.createElement('span');
                 text.classList.add('tsLogs-modulesList__libName');
                 text.textContent = `${libName} `;
                 const num = document.createElement('span');
                 num.classList.add('tsLogs-modulesList__number');
                 num.textContent = numberOfErrors;
                 libElem.append(text, num);
                 container.appendChild(libElem);
              });
           });
           container.addEventListener('click', (e) => {
              let target = e.target.closest('[data-libraryName]') ?? e.target.closest('[data-moduleName]');
              onSelectedChange(target.dataset.modulename, target.dataset.libraryname ?? '');
              selectedElement.classList.remove(selectedClass);
              target.classList.add(selectedClass);
              selectedElement = target;
           });
           return container;
        }
        function ErrorsList(errors) {
            const container = document.createElement('div');
            container.classList.add('tsLogs-errorsList');

            const cellClass = 'tsLogs-errorsList__cell';

            function addCell(value) {
               const cell = document.createElement('div');
               cell.classList.add(cellClass);
               cell.textContent = value;
               container.appendChild(cell);
            }

            addCell('Файл');
            addCell('Ошибка');
            errors.forEach(({ file, message }) => {
               addCell(`${file.path}${file.loc}`);
               addCell(message);
            });

            return container;
        }
        function collectModuleErrors(errors) {
           let result = [];
           Object.entries(errors).forEach(([_, errors]) => {
              result.push(...errors);
           });
           return result;
        }
        async function App() {
           const rawData = await loadData(await loadMeta());
           const numberOfErrorsByModule = {};
           const errorsByModule = {};
           const root = document.querySelector('.root');
           rawData.forEach((error) => {
              const module = error.location.module;
              if (!numberOfErrorsByModule.hasOwnProperty(module)) {
                 numberOfErrorsByModule[module] = {
                    total: 0
                 };
                 errorsByModule[module] = {};
              }
              const path = error.library ? error.library : error.file.path;
              if (!numberOfErrorsByModule[module].hasOwnProperty(path)) {
                 numberOfErrorsByModule[module][path] = 0;
                 errorsByModule[module][path] = [];
              }
              numberOfErrorsByModule[module][path]++;
              errorsByModule[module][path].push(error);
              numberOfErrorsByModule[module].total++;
           });
           document.body.prepend(`Всего ошибок: ${rawData.length}.`);
           let selectedModule = rawData[0].location.module;
           root.appendChild(ModulesList(numberOfErrorsByModule, selectedModule, onModuleChange));
           let errorsList = ErrorsList(collectModuleErrors(errorsByModule[selectedModule]));
           root.appendChild(errorsList);
           function onModuleChange(newSelectedModule, libraryName) {
              errorsList.remove();
              if (libraryName) {
                 errorsList = ErrorsList(errorsByModule[newSelectedModule][libraryName]);
              } else {
                 errorsList = ErrorsList(collectModuleErrors(errorsByModule[newSelectedModule]));
              }
              root.appendChild(errorsList);
           }
        }
        App();
    </script>
</head>
<body style="height: 100vh; overflow: hidden;">
    <div class="root" style="height: 100%;"></div>
</body>
</html>
